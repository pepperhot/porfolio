name: Update portfolio stats

on:
  schedule:
    - cron: "0 */6 * * *"   # toutes les 6h
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - .github/workflows/update-stats.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HTB_TOKEN: ${{ secrets.HTB_TOKEN }}
        run: python scripts/update_stats.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git config user.name  "portfolio-bot"
            git config user.email "portfolio-bot@users.noreply.github.com"
            git add data.json
            git commit -m "chore(stats): auto-update $(date -u +%FT%TZ)"
            git push
          else
            echo "no changes"
          fi
